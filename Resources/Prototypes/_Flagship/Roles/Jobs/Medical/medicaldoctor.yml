- type: job
  id: FlagMedicalDoctor
  name: job-name-flag-medicaldoctor
  description: job-description-flag-medicaldoctor
  playTimeTracker: JobFlagMedicalDoctor
  setPreference: true
  requirements:
    - !type:DepartmentTimeRequirement
      department: Medical
      time: 36000 #10 hrs
  displayWeight: 80
  startingGear: FlagMedicalDoctorGear
  icon: "JobIconFlagMedicalDoctor"
  supervisors: job-supervisors-chom
  access:
  - Medical
  - Maintenance
  extendedAccess:
  - Chemistry
  special:
  - !type:GiveItemOnHolidaySpecial
    holiday: DoctorDay
    prototype: WehMedipen


- type: entity
  id: MachineCryoSleepPod
#  parent: [BaseStructureDisableToolUse, BaseStructureIndestructible, BaseMachine] / Flagship
  parent: [BaseStructureIndestructible, BaseMachine]
  name: cryo sleep chamber
  description: Cold pillow, guaranteed.
  components:
  - type: Sprite
    netsync: false
    sprite: _NF/Structures/Machines/cryopod.rsi
    layers:
    - state: closed
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 190
        mask:
        - MachineMask
        layer:
        - MobLayer # To allow people to pass through
  - type: MaterialStorage
  - type: Appearance
  - type: Climbable
#  - type: CryoSleep
  - type: ContainerContainer
    containers:
      body_container: !type:ContainerSlot

      # If cryopods get deleted, this one is considered as a safe fallback.
- type: entity
  id: MachineCryoSleepPodFallback
  parent: MachineCryoSleepPod
  suffix: Fallback
#  components:
#  - type: CryoSleepFallback


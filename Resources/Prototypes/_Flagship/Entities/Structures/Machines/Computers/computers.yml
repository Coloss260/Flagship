  parent: ComputerSalvageExpedition
  suffix: Debug
  components:
  - type: SalvageExpeditionConsole
    debug: true

# Station Traffic Controller consoles
- type: entity
  id: BaseComputerTraffic
  abstract: true
  components:
  - type: RadarConsole
  - type: DetectionRangeMultiplier
    infraredMultiplier: 1
    visualMultiplier: 3
  - type: Computer
    board: Null
  - type: Sprite
    drawdepth: SmallObjects
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      sprite: Structures/Machines/computers.rsi
      state: shuttle
    - map: ["computerLayerKeys"]
      sprite: Structures/Machines/computers.rsi
      state: generic_keys
  - type: AccessReader
    access: [["StationTrafficController"]]
  - type: ActivatableUIRequiresAccess
  - type: WorldLoader
    disabled: true
    radius: 0 # Just in case.

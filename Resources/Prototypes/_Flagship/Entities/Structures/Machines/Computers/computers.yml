- type: entity
  parent: ComputerRadar
  id: ComputerAdvancedRadar # Frontier
  name: advanced radar computer
  description: This advanced radar lets you detect far away objects for an increased tactical advantage.
  components:
  - type: Computer
    board: AdvancedRadarConsoleCircuitboard
#  - type: DetectionRangeMultiplier
#    infraredMultiplier: 1.2
#    visualMultiplier: 1.5
  - type: RadarConsole
    maxIffRange: null # Frontier
  - type: Sprite
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      state: eris_control
    - map: ["computerLayerKeys"]
      state: generic_keys

- type: entity
  parent: ComputerShuttle
  id: ComputerShuttleAntag
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      state: syndishuttle
    - map: ["computerLayerKeys"]
      state: syndie_key
  - type: PointLight
    radius: 1.5
    energy: 1.6
    color: "#c94242"

- type: entity
  #parent: [BaseStructureDisableToolUse, BaseStructureIndestructible, ComputerIFFSyndicate]
  parent: [BaseStructureIndestructible, ComputerIFFSyndicate]
  id: ComputerIFFPOI
  name: IFF computer
  suffix: POI
  description: Allows you to control the IFF and stealth characteristics of this station.
  components:
  - type: IFFConsole
    allowedFlags:
    - Hide
  - type: ActivatableUI
    key: enum.IFFConsoleUiKey.Key
  - type: UserInterface
    interfaces:
      enum.IFFConsoleUiKey.Key:
        type: IFFConsoleBoundUserInterface
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface
  - type: Computer
    board: Null

- type: entity
  name: cargo market computer
  abstract: true
  #parent: [BaseStructureDisableToolUse, BaseStructureIndestructible, BaseComputer]
  parent: [BaseStructureIndestructible, BaseComputer]
  id: ComputerMarketConsoleNFBase
  description: Used to buy goods from the station's market system.
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      sprite: _NF/Structures/Machines/computers.rsi
      state: cargo_market
    - map: ["computerLayerKeys"]
      state: tech_key
